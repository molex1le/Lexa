# Memory budget (docs/ARCHITECTURE.md §18)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
# Compile Kotlin inside the Gradle daemon: no separate Kotlin daemon left running,
# no run files or logs outside the project.
kotlin.compiler.execution.strategy=in-process
# The daemon stops after 10 minutes idle
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
# No local build cache: nothing grows in GRADLE_USER_HOME between builds
org.gradle.caching=false
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
