name: Релиз

# Ставишь тег и пушишь его – GitHub прогоняет тесты, собирает подписанный APK и создаёт релиз.
# Приложение раз в день (и при каждом запуске) смотрит последний релиз и предлагает обновиться.
# Текст тега = «что нового»:
#   git tag -a v0.4.0 -m "- Починил …" && git push origin v0.4.0
# Тег должен совпадать с versionName в app/build.gradle.kts (и versionCode должен вырасти).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.LEXA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Нет секрета LEXA_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lexa.jks"
          echo "LEXA_KEYSTORE=$RUNNER_TEMP/lexa.jks" >> "$GITHUB_ENV"

      - name: Тесты и подписанная сборка
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Версия в теге совпадает с versionName
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "v$NAME" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME не совпадает с versionName $NAME"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Lexa-$NAME.apk"
          echo "APK=$RUNNER_TEMP/Lexa-$NAME.apk" >> "$GITHUB_ENV"

      - name: Что нового – из текста тега
        run: |
          git fetch --force --tags
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/^-----BEGIN/,$d' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then echo "Исправления и улучшения" > "$RUNNER_TEMP/notes.md"; fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Lexa ${{ github.ref_name }}
          files: ${{ env.APK }}
          body_path: ${{ runner.temp }}/notes.md

      - name: Удалить ключ с машины сборки
        if: always()
        run: rm -f "$RUNNER_TEMP/lexa.jks"
